name: Build xaga boot.img + rootfs.img (All-in-One)

# ============================================================================
# 红米 Note 11T Pro (xaga) 一站式构建
# ============================================================================
#
# 一次运行产出两样东西：
#   1. boot.img   —— 主线内核 + 自编 initramfs（先执行）
#   2. rootfs.img —— Arch Linux ARM 系统镜像（后执行）
# 最终统一发布到 GitHub Release 永久资源。
#
# 顺序执行的原因：rootfs 阶段需要知道内核的构建结果来生成 README，
# 且两者共享同一 workspace，避免用 artifact 中转（省时间和空间）。
#
# ----------------------------------------------------------------------------
# 触发方式
# ----------------------------------------------------------------------------
#   1. 手动触发（Actions 页面 → "Run workflow"）
#      所有参数均有默认值，直接点 Run 即可跑通全流程；
#      也可以用下面的 build_target 下拉框只跑其中一个阶段。
#   2. push tag
#      - all-v*    → 本工作流（全跑）
#      - v*        → build-xaga-boot.yml（只编内核）
#      - rootfs-v* → build-xaga-rootfs.yml（只构 rootfs）
#
# ----------------------------------------------------------------------------
# 【示例配置】6+128 版本 · 无桌面 · 密码 root
# ----------------------------------------------------------------------------
# 下面这套参数对应「Redmi Note 11T Pro 6GB RAM + 128GB 存储，
# 只装纯命令行系统（不装图形界面）」的典型用法。
# 在 Actions → Run workflow 的页面上照着填即可：
#
#   ┌────────────────────┬──────────────────────┬──────────────────────────┐
#   │ 参数               │ 本示例填写的值       │ 是否需改动               │
#   ├────────────────────┼──────────────────────┼──────────────────────────┤
#   │ build_target       │ all (全部)           │ 保持默认                 │
#   │ kernel_branch      │ 7.2-mt6895-xiaomi-xaga│ 保持默认（下拉选）      │
#   │ kernel_repo        │ https://github.com/  │ 保持默认                 │
#   │                    │ MT6895-Mainline/     │                          │
#   │                    │ linux.git            │                          │
#   │ boot_partition     │ /dev/sdc86           │ 保持默认                 │
#   │ nvdata_partition   │ /dev/sdc13           │ 保持默认                 │
#   │ arch_tarball_url   │ http://os.archlinuxarm.org/os/  │ 保持默认       │
#   │                    │ ArchLinuxARM-aarch64-latest.    │                │
#   │                    │ tar.gz               │                          │
#   │ image_size_gb      │ 6                    │ ⚠️ 默认值已是 6，无需改 │
#   │ hostname           │ xaga                 │ 保持默认                 │
#   │ root_password      │ root                 │ 保持默认                 │
#   │ desktop            │ none                 │ ⚠️ 改为 none（无桌面）  │
#   │ extra_packages     │ (留空)               │ 保持默认                 │
#   │ wifi_ssid          │ iQOO 11              │ ⚠️ 按你自己的热点填写   │
#   │ wifi_password      │ password             │ ⚠️ 按你自己的热点填写   │
#   │ create_release     │ ✅ 勾选              │ 保持默认（true）         │
#   └────────────────────┴──────────────────────┴──────────────────────────┘
#
#   即本示例相对默认值只改了 3 个字段：desktop → none，
#   wifi_ssid → iQOO 11，wifi_password → password。
#
#   说明：
#     - 6+128 的机器总存储 128GB，但 userdata 分区实际可用约 100+GB，
#       这里 image_size_gb=6 只是「初始镜像」大小，刷完首次开机执行
#       resize2fs 就能把分区撑满剩余空间，所以不必一上来就设很大。
#       设小一点的好处：gha 造镜像快、Release 附件小、下载快。
#     - desktop=none 即纯命令行（tty/serial + ssh），开机内存占用极低，
#       适合当随身小服务器 / 调试机；后续想要桌面可以直接
#       pacman -S plasma-desktop sddm 补装。
#     - wifi_ssid="iQOO 11" 说明 SSID 里带空格是允许的（YAML 里加引号即可），
#       注意要用手机热点的 2.4GHz 频段，xaga 在主线下的 5GHz 支持不稳。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      # ============ 任务选择 ============
      build_target:
        description: |
          [任务] 本次要跑哪些步骤（下拉选择）
          - all         : 全跑 —— 先编内核出 boot.img，再构 rootfs.img（推荐）
          - boot-only   : 只跑第 1 阶段，产出 boot.img（改内核参数后重刷时用）
          - rootfs-only : 只跑第 2 阶段，产出 rootfs.img（改软件包/桌面时用）
          两者都会独立打包并发布，互不依赖（rootfs.img 不含内核）。
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'boot-only'
          - 'rootfs-only'

      # ============ 内核相关 ============
      kernel_branch:
        description: |
          [内核] 要编译的分支名（下拉选择）
          - 7.2-mt6895-xiaomi-xaga  : 7.2 内核，功能最新，推荐
          - 6.18-mt6895-xiaomi-xaga : 6.18 LTS 内核，更保守
          注意：分支必须存在于下面的 kernel_repo 中，写错会在
          "Merge kernel config" 步骤因找不到 xaga.config 而报错。
        required: true
        default: '7.2-mt6895-xiaomi-xaga'
        type: choice
        options:
          - '7.2-mt6895-xiaomi-xaga'
          - '6.18-mt6895-xiaomi-xaga'
      kernel_repo:
        description: |
          [内核] 内核源码仓库地址（git clone 用）
          默认是 MT6895-Mainline 官方仓库；若你 fork 过并改了配置，
          填你自己的地址即可（需为公开仓库，无需鉴权）。
        required: true
        default: 'https://github.com/MT6895-Mainline/linux.git'
        type: string
      boot_partition:
        description: |
          [内核] initramfs 里要找的 boot / rootfs 分区路径
          指的是「内核启动后，系统所在分区在 Linux 下的设备节点」，
          不是 fastboot 里的分区名，也不是 userdata 这个名字本身。
          xaga 上 userdata 在 Linux 下枚举为 /dev/sdc86，默认值即此。
          除非你改过分区表（GUID），否则不要动。
        required: true
        default: '/dev/sdc86'
        type: string
      nvdata_partition:
        description: |
          [内核] initramfs 里要找的 nvdata 分区路径
          nvdata 存放 WiFi/BT 的 MAC 地址等校准数据，主线系统需要
          在启动早期读取它。xaga 上枚举为 /dev/sdc13。
          同样：除非改过分区表，否则不要动。
        required: true
        default: '/dev/sdc13'
        type: string

      # ============ rootfs 相关 ============
      arch_tarball_url:
        description: |
          [rootfs] Arch Linux ARM 基础 tarball 地址
          默认取官方 aarch64 最新版，仓库里自带的旧内核会在后续步骤
          被删掉（我们用自编主线内核）。国内网络慢可以换成镜像站，
          例如 https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/os/
          ArchLinuxARM-aarch64-latest.tar.gz
        required: true
        default: 'http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz'
        type: string
      image_size_gb:
        description: |
          [rootfs] 生成的 rootfs.img 初始容量，单位 GB（纯数字）
          这是「镜像文件本身」的大小，不是分区大小。
          建议值：
            - 纯命令行（desktop=none）: 6 足够（默认值）
            - KDE / GNOME 等完整桌面 : 10 ~ 16
          刷入并首次开机后执行 resize2fs 即可撑满整个 userdata 分区，
          所以这里设小不会浪费空间，只是省下载流量和构建时间。
          设置过小（< 实际占用）会导致 rsync 阶段写入失败。
        required: true
        default: '6'
        type: string
      hostname:
        description: |
          [rootfs] 系统主机名，会写入 /etc/hostname
          ssh 登录后提示符上显示的名字，随意。
        required: true
        default: 'xaga'
        type: string
      root_password:
        description: |
          [rootfs] root 用户的登录密码（明文，会写进镜像）
          ⚠️ 系统里「只有 root 一个用户」，没有 alarm 等其他账号。
          ⚠️ 本仓库构建产物若公开上传，密码等于公开，登录后请立即
             用 passwd 修改；或用 ssh 密钥登录并关闭密码认证。
          ⚠️ 密码里避免出现 $ ` " \ 等会被 shell/YAML 解析的字符。
        required: true
        default: 'root'
        type: string
      desktop:
        description: |
          [rootfs] 桌面环境（下拉选择）
          - kde  : KDE Plasma，功能最全，包最多，构建最久（默认）
          - phosh: 手机风格触屏界面（GNOME 系），适合当手机用
          - sway : 轻量平铺窗口管理器，资源占用低
          - none : 不装图形界面，纯命令行 + ssh（最快的构建）
          注意：none 只是不装桌面，NetworkManager / sshd / 蓝牙等
          基础服务照样会装并开机自启。
        required: true
        default: 'kde'
        type: choice
        options:
          - 'kde'
          - 'phosh'
          - 'sway'
          - 'none'
      extra_packages:
        description: |
          [rootfs] 额外安装的 Arch 包，空格分隔
          例如填 "htop tmux neofetch" 会一并装进镜像。
          留空则不加。包名必须是 Arch Linux ARM 仓库里真实存在的，
          写错会导致 pacman 返回非零而构建失败。
        required: false
        default: ''
        type: string
      wifi_ssid:
        description: |
          [rootfs] 开机自动连接的 WiFi 名称（SSID）
          留空则不预置任何 WiFi，开机后需手动 nmcli 连接。
          SSID 里有空格/中文都可以，例如 iQOO 11。
          注意：xaga 主线当前 5GHz 支持不稳，建议用 2.4GHz 热点。
        required: false
        default: ''
        type: string
      wifi_password:
        description: |
          [rootfs] 上面那个 WiFi 的密码（WPA2 口令）
          仅在 wifi_ssid 非空时有意义；开放网络请留空。
          密码会明文存在镜像内的 .nmconnection 文件里（权限 600）。
        required: false
        default: ''
        type: string

      # ============ 发布 ============
      compress_artifacts:
        description: |
          是否压缩产物后再上传（强烈建议开启，能省 8~10 倍下载流量）
          - ✅ 勾选 : 生成 boot.img.gz 和 rootfs.img.gz，原始 .img 不上传
          - ⬜ 不勾 : 上传原始 .img（6GB 的 rootfs 直接传，很慢）
          实测 6GB 镜像（含约 1.5GB 数据）压完约 550~680MB。
          单文件超过 2GB 会被自动分卷成 .gz.part-aa / .gz.part-ab ...
          刷机前需要先解压，见 README.txt 中的命令。
        required: true
        default: true
        type: boolean
      create_release:
        description: |
          是否创建 GitHub Release（永久资源，不会 30 天过期）
          - ✅ 勾选 : 产物同时上传到 Release，可直接给他人下载链接
          - ⬜ 不勾 : 只留 Actions Artifacts（30 天后自动清理）
          无论是否勾选，Artifacts 都会上传。
        required: true
        default: true
        type: boolean

  push:
    tags:
      - 'all-v*'

permissions:
  contents: write

env:
  # ---- boot.img 头部参数（与 postmarketOS Wiki 一致，改动务必谨慎）----
  KERNEL_BASE: '0x3fff8000'
  KERNEL_OFFSET: '0x8000'
  PAGESIZE: '4096'
  RAMDISK_OFFSET: '0x26f08000'
  TAGS_OFFSET: '0x07c88000'
  DTB_OFFSET: '0x07c88000'
  HEADER_VERSION: '4'
  OS_VERSION: '16.0.0'
  OS_PATCH_LEVEL: '2026-08'
  # Arch Linux ARM 签名密钥
  ALARM_KEY: '68B3537F39A313B3E574D06777193F152BDBE6A6'
  # ---- 产物压缩 ----
  # pigz 是 gzip 的多线程版，产出的 .gz 全平台（Linux/Windows/macOS、
  # 7-Zip/WinRAR/Bandizip）都能直接解，且解压速度远快于 xz。
  # 压缩级别 9 在 4 核 runner 上对 6GB 镜像约 1~2 分钟。
  # 超过 2GB 的单个产物会被自动分卷（见 Split large artifacts 步骤）。
  SPLIT_SIZE: '2G'

jobs:
  build:
    name: Build boot.img + rootfs.img
    runs-on: ubuntu-24.04
    # 内核 ~20min + rootfs ~40min（KDE 会久一些），留足余量
    timeout-minutes: 300

    steps:
      # =================================================================
      # 第 0 部分：参数解析
      # =================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        run: |
          set -e

          # 压缩步骤（pigz）和后续脚本依赖这几个工具，且无论跑哪个
          # build_target 都要用，所以在这里统一装好，避免依赖 boot/rootfs 分支。
          # 注意：必须在下面用 numfmt/bc 之前安装。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pigz bc coreutils

          for t in pigz bc numfmt split; do
            command -v "$t" >/dev/null 2>&1 \
              && echo "✅ $t 可用" \
              || { echo "::error::缺少 $t"; exit 1; }
          done

          # push tag 时 inputs 全为空，这里统一兜底
          BT="${{ github.event.inputs.build_target }}"
          [ -z "$BT" ] && BT="all"

          KB="${{ github.event.inputs.kernel_branch }}"
          [ -z "$KB" ] && KB="7.2-mt6895-xiaomi-xaga"

          KR="${{ github.event.inputs.kernel_repo }}"
          [ -z "$KR" ] && KR="https://github.com/MT6895-Mainline/linux.git"

          BP="${{ github.event.inputs.boot_partition }}"
          [ -z "$BP" ] && BP="/dev/sdc86"

          NP="${{ github.event.inputs.nvdata_partition }}"
          [ -z "$NP" ] && NP="/dev/sdc13"

          TB="${{ github.event.inputs.arch_tarball_url }}"
          [ -z "$TB" ] && TB="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"

          SZ="${{ github.event.inputs.image_size_gb }}"
          [ -z "$SZ" ] && SZ="6"

          HN="${{ github.event.inputs.hostname }}"
          [ -z "$HN" ] && HN="xaga"

          RP="${{ github.event.inputs.root_password }}"
          [ -z "$RP" ] && RP="root"

          DK="${{ github.event.inputs.desktop }}"
          [ -z "$DK" ] && DK="kde"

          # 由 build_target 推出两个布尔量，供后续步骤 if 使用
          case "$BT" in
            all)
              DO_BOOT="true"
              DO_ROOTFS="true"
              ;;
            boot-only)
              DO_BOOT="true"
              DO_ROOTFS="false"
              ;;
            rootfs-only)
              DO_BOOT="false"
              DO_ROOTFS="true"
              ;;
            *)
              echo "::error::build_target 取值非法: $BT"; exit 1
              ;;
          esac

          {
            echo "build_target=$BT"
            echo "do_boot=$DO_BOOT"
            echo "do_rootfs=$DO_ROOTFS"
            echo "kernel_branch=$KB"
            echo "kernel_repo=$KR"
            echo "boot_part=$BP"
            echo "nvdata_part=$NP"
            echo "tarball=$TB"
            echo "img_size=$SZ"
            echo "hostname=$HN"
            echo "root_pw=$RP"
            echo "desktop=$DK"
          } >> $GITHUB_OUTPUT

          {
            echo "## 📋 本次构建配置"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 任务选择 | \`$BT\` |"
            echo "| 内核分支 | \`$KB\` |"
            echo "| 内核仓库 | $KR |"
            echo "| boot 分区 | \`$BP\` |"
            echo "| nvdata 分区 | \`$NP\` |"
            echo "| rootfs 大小 | \`${SZ} GB\` |"
            echo "| 桌面环境 | \`$DK\` |"
            echo "| 主机名 | \`$HN\` |"
            echo "| 用户 | 仅 \`root\` |"
            echo "| 预置 WiFi | ${{ github.event.inputs.wifi_ssid != '' && github.event.inputs.wifi_ssid || '(无)' }} |"
            echo "| 产物压缩 | ${{ github.event.inputs.compress_artifacts != 'false' && '✅ gzip (pigz)' || '❌ 原始镜像' }} |"
          } >> $GITHUB_STEP_SUMMARY

          echo "任务选择   : $BT (boot=$DO_BOOT, rootfs=$DO_ROOTFS)"
          echo "内核分支   : $KB"
          echo "boot 分区  : $BP"
          echo "nvdata 分区: $NP"
          echo "rootfs 大小: ${SZ}GB"
          echo "桌面环境   : $DK"
          echo "主机名     : $HN"
          echo "产物压缩   : ${{ github.event.inputs.compress_artifacts != 'false' && 'yes (pigz -9)' || 'no' }}"

      # =================================================================
      # 第 1 部分：编译内核 boot.img
      # 仅当 build_target ∈ {all, boot-only} 时执行
      # =================================================================
      - name: "[boot] Install build dependencies"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip cpio gzip lz4 xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zstd rsync \
            mkbootimg android-sdk-libsparse-utils

      - name: "[boot] Set up working mkbootimg"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e

          # ============================================================
          # 背景：Ubuntu 的 mkbootimg 包是「上游 AOSP 脚本 + 漏打包依赖」，
          # 直接运行会报：
          #   ModuleNotFoundError: No module named 'gki'
          # 因为 /usr/bin/mkbootimg 第 31 行有模块级 import：
          #   from gki.generate_gki_certificate import generate_gki_certificate
          # 而 gki/ 目录根本没被装进 deb（dpkg -L mkbootimg 可以证实）。
          #
          # 这个 gki 模块只在传 --gki_signing_key 做 GKI 签名时才真正用到，
          # 我们打包的是 header_version=4 的普通 boot.img，不走签名路径，
          # 所以塞一个 stub 让它 import 成功即可。
          #
          # 注意：pip 上没有 mkbootimg 包（PyPI 无此发行），别再走 pip。
          # ============================================================

          WORKDIR="$RUNNER_TEMP/mkbootimg-shim"
          mkdir -p "$WORKDIR/gki"

          : > "$WORKDIR/gki/__init__.py"
          cat > "$WORKDIR/gki/generate_gki_certificate.py" <<'PYEOF'
          """Stub 替代 AOSP 的 gki.generate_gki_certificate。

          真正的实现只在 mkbootimg 收到 --gki_signing_key 时才会被调用。
          我们不做 GKI 签名，这里只需要让模块级 import 成功即可。
          万一真被调用，就明确报错而不是静默产生错误的镜像。
          """


          def generate_gki_certificate(*args, **kwargs):
              raise NotImplementedError(
                  "本环境未提供 GKI 签名实现；本 workflow 不需要 GKI 签名。"
              )
          PYEOF

          # 用 shim 目录优先于系统路径，让 import gki 能解析到
          echo "PYTHONPATH=$WORKDIR" >> $GITHUB_ENV

          echo "=== 验证 mkbootimg 可用 ==="
          export PYTHONPATH="$WORKDIR"
          mkbootimg --help >/dev/null 2>&1 \
            && echo "✅ mkbootimg 可用" \
            || { echo "::error::mkbootimg 仍不可用"; mkbootimg --help; exit 1; }

          echo "mkbootimg 位置: $(command -v mkbootimg)"
          echo "python3        : $(python3 --version)"

          # 记录一下顶层参数，方便后续核对
          echo "=== --help 摘要 ==="
          mkbootimg --help 2>&1 | grep -E "header_version|pagesize|dtb_offset" || true

      - name: "[boot] Smoke-test mkbootimg (self-check)"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e
          # 用两个小文件真打一次包，确认能产出合法的 v4 header。
          # 这样如果打包器有问题，在这里就报错，而不是等十几分钟编译完才炸。
          D="$RUNNER_TEMP/mkboot-smoke"
          rm -rf "$D"; mkdir -p "$D"; cd "$D"

          head -c 1048576 /dev/urandom > Image.gz
          head -c 65536   /dev/urandom > ramdisk.lz4

          mkbootimg \
            --kernel Image.gz \
            --ramdisk ramdisk.lz4 \
            --base            "$KERNEL_BASE" \
            --kernel_offset   "$KERNEL_OFFSET" \
            --pagesize        "$PAGESIZE" \
            --ramdisk_offset  "$RAMDISK_OFFSET" \
            --tags_offset     "$TAGS_OFFSET" \
            --dtb_offset      "$DTB_OFFSET" \
            --header_version  "$HEADER_VERSION" \
            --os_version      "$OS_VERSION" \
            --os_patch_level  "$OS_PATCH_LEVEL" \
            -o smoke.img

          python3 - <<'PY'
          import struct, sys
          d = open('smoke.img', 'rb').read(4096)
          assert d[:8] == b'ANDROID!', f'magic 异常: {d[:8]}'
          ksize, rsize, osver, hsize = struct.unpack_from('<4I', d, 8)
          hver = struct.unpack_from('<I', d, 0x28)[0]
          print(f'  kernel_size    : {ksize}')
          print(f'  ramdisk_size   : {rsize}')
          print(f'  header_size    : {hsize}  (v4 应为 1584)')
          print(f'  header_version : {hver}')
          assert hver == 4, f'header_version 应为 4，实际 {hver}'
          assert hsize == 1584, f'header_size 应为 1584，实际 {hsize}'
          print('✅ mkbootimg 冒烟测试通过：可正常产出 boot v4 镜像')
          PY

      - name: "[boot] Show toolchain versions"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          echo "=== aarch64 gcc ==="; aarch64-linux-gnu-gcc --version | head -1
          echo "=== clang ==="; clang --version | head -1
          echo "=== ld.lld ==="; ld.lld --version
          echo "=== nproc ==="; nproc --all

      - name: "[boot] Clone kernel source"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e
          for i in 1 2 3; do
            git clone -b "${{ steps.meta.outputs.kernel_branch }}" --depth 1 \
              "${{ steps.meta.outputs.kernel_repo }}" linux && break
            echo "第 $i 次失败，重试..."; rm -rf linux; sleep 15
          done
          test -d linux || { echo "::error::内核源码拉取失败"; exit 1; }

          cd linux
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      - name: "[boot] Merge kernel config"
        if: steps.meta.outputs.do_boot == 'true'
        working-directory: linux
        run: |
          set -e
          test -f arch/arm64/configs/defconfig || {
            echo "::error::找不到 arch/arm64/configs/defconfig"; exit 1; }
          test -f arch/arm64/configs/xaga.config || {
            echo "::error::找不到 arch/arm64/configs/xaga.config（分支选错了？）"; exit 1; }

          ARCH=arm64 scripts/kconfig/merge_config.sh \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/xaga.config

          make ARCH=arm64 LLVM=1 olddefconfig

          echo "=== 关键配置 ==="
          grep -E '^CONFIG_(LOCALVERSION|LZ4|RD_LZ4|ARCH_MEDIATEK)=' .config || true

      - name: "[boot] Build kernel Image"
        if: steps.meta.outputs.do_boot == 'true'
        working-directory: linux
        run: |
          set -e
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" Image
          ls -lh arch/arm64/boot/Image
          file arch/arm64/boot/Image

      - name: "[boot] Build device tree blob"
        if: steps.meta.outputs.do_boot == 'true'
        working-directory: linux
        run: |
          set -e
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" \
            arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb || true

          if [ -f arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb ]; then
            ls -lh arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb
          else
            echo "::warning::未生成独立 dtb（DTB 已链入 Image，属正常）"
          fi

      - name: "[boot] Clone initramfs source"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/MT6895-Mainline/initramfs.git && break
            echo "第 $i 次失败，重试..."; rm -rf initramfs; sleep 15
          done
          test -d initramfs || { echo "::error::initramfs 拉取失败"; exit 1; }

          cd initramfs
          echo "INITRAMFS_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "INITRAMFS_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      - name: "[boot] Build initramfs"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e
          BOOT_PART="${{ steps.meta.outputs.boot_part }}"
          NVDATA_PART="${{ steps.meta.outputs.nvdata_part }}"

          cd initramfs
          make clean

          # 上游 Makefile 只注入 BOOT_PARTITION；
          # NVDATA_PARTITION 在 init.c 里是 #ifndef 默认宏（/dev/sdc13）。
          # 用 EXTRA_CFLAGS 追加，不改上游 Makefile。
          sed -i 's|^CFLAGS := |CFLAGS := $(EXTRA_CFLAGS) |' Makefile
          grep -E '^CFLAGS' Makefile

          make \
            CROSS=aarch64-linux-gnu- \
            BOOT_PARTITION="$BOOT_PART" \
            EXTRA_CFLAGS="-DNVDATA_PARTITION=\\\"$NVDATA_PART\\\""

          ls -lh initramfs.cpio.lz4 root/init
          aarch64-linux-gnu-readelf -h root/init | grep -E 'Machine|Type'
          echo "=== 确认分区宏已注入 ==="
          strings root/init | grep -E '^/dev/sd' || true

      - name: "[boot] Pack boot.img"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e
          mkdir -p out tmp

          gzip -n -9 -c linux/arch/arm64/boot/Image > tmp/Image.gz
          ls -lh tmp/Image.gz

          # header_version 4 不接受 --dtb（DTB 已链入内核镜像）
          mkbootimg \
            --kernel tmp/Image.gz \
            --ramdisk initramfs/initramfs.cpio.lz4 \
            --base            "$KERNEL_BASE" \
            --kernel_offset   "$KERNEL_OFFSET" \
            --pagesize        "$PAGESIZE" \
            --ramdisk_offset  "$RAMDISK_OFFSET" \
            --tags_offset     "$TAGS_OFFSET" \
            --dtb_offset      "$DTB_OFFSET" \
            --header_version  "$HEADER_VERSION" \
            --os_version      "$OS_VERSION" \
            --os_patch_level  "$OS_PATCH_LEVEL" \
            -o out/boot.img

          ls -lh out/boot.img

          echo "=== boot.img 头部校验 ==="
          python3 - <<'PY'
          import struct, sys

          # boot_img_hdr 布局（AOSP include/bootimg/bootimg.h）：
          #   0x00  char     magic[8]        "ANDROID!"
          #   0x08  uint32_t kernel_size
          #   0x0c  uint32_t ramdisk_size
          #   0x10  uint32_t os_version
          #   0x14  uint32_t header_size     (v4 = 1584)
          #   0x18  uint32_t reserved[4]     (16 字节)
          #   0x28  uint32_t header_version  ← 注意在 0x28，不在前 7 个 uint32 里
          #
          # 另注：header_version >= 3 时，内核/ramdisk/tags 的加载地址
          # 不再写进 header，而由 bootloader（xaga 上是定制 LK）自行决定。
          # 所以 --base/--kernel_offset 等参数在 v4 下不影响加载地址，
          # 只用于镜像内部页对齐，读不到它们是正常的、不是错误。
          d = open('out/boot.img', 'rb').read(4096)

          magic = d[0x00:0x08]
          if magic != b'ANDROID!':
              print('!! magic 异常:', magic); sys.exit(1)

          ksize = struct.unpack_from('<I', d, 0x08)[0]
          rsize = struct.unpack_from('<I', d, 0x0c)[0]
          osver = struct.unpack_from('<I', d, 0x10)[0]
          hsize = struct.unpack_from('<I', d, 0x14)[0]
          hver  = struct.unpack_from('<I', d, 0x28)[0]

          print(f'magic          : {magic.decode()}')
          print(f'kernel_size    : {ksize} ({ksize/1024/1024:.2f} MB)')
          print(f'ramdisk_size   : {rsize} ({rsize/1024:.1f} KB)')
          print(f'header_size    : {hsize}  (v4 应为 1584)')
          print(f'header_version : {hver}')

          if hver != 4:
              print(f'!! header_version 应为 4，实际 {hver}'); sys.exit(1)
          if hsize != 1584:
              print(f'!! header_size 应为 1584，实际 {hsize}'); sys.exit(1)
          if ksize == 0:
              print('!! kernel 为空'); sys.exit(1)
          if rsize == 0:
              print('!! ramdisk 为空'); sys.exit(1)
          print('OK: boot.img 校验通过')
          PY

      - name: "[boot] Checksum boot.img"
        if: steps.meta.outputs.do_boot == 'true'
        run: |
          set -e
          cd out
          sha256sum boot.img | tee boot.img.sha256

      # =================================================================
      # 第 2 部分：构建 Arch Linux ARM rootfs.img
      # 仅当 build_target ∈ {all, rootfs-only} 时执行
      # =================================================================
      - name: "[rootfs] Set up QEMU"
        if: steps.meta.outputs.do_rootfs == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: "[rootfs] Install host dependencies"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support \
            bsdtar libarchive-tools \
            e2fsprogs util-linux \
            curl wget gnupg ca-certificates

          echo "=== binfmt ==="
          ls /proc/sys/fs/binfmt_misc/ || true

      - name: "[rootfs] Download ArchLinuxARM tarball"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          mkdir -p work
          cd work

          TB="${{ steps.meta.outputs.tarball }}"
          echo "下载: $TB"
          for i in 1 2 3; do
            wget -q --show-progress -O alarm.tar.gz "$TB" && break
            echo "第 $i 次失败，重试..."; sleep 15
          done
          test -s alarm.tar.gz || { echo "::error::下载失败"; exit 1; }
          ls -lh alarm.tar.gz

          echo "=== PGP 签名校验 ==="
          if wget -q -O alarm.tar.gz.sig "${TB}.sig"; then
            gpg --keyserver keyserver.ubuntu.com --recv-keys "$ALARM_KEY" || true
            gpg --verify alarm.tar.gz.sig alarm.tar.gz \
              && echo "✅ 签名校验通过" \
              || echo "::warning::签名校验未通过，继续"
          else
            echo "::warning::未取得 .sig，跳过"
          fi

          sha256sum alarm.tar.gz | tee alarm.tar.gz.sha256

      - name: "[rootfs] Extract rootfs"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work
          mkdir -p rootfs
          sudo bsdtar -xpf alarm.tar.gz -C rootfs
          ls rootfs/
          du -sh rootfs/

      - name: "[rootfs] Strip conflicting boot files"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work/rootfs

          echo "=== 删除前 ==="; ls -la boot/ 2>/dev/null || true

          # ALARM 自带内核与引导配置全部移除，避免与主线内核冲突
          sudo rm -f  boot/Image boot/Image.gz
          sudo rm -rf boot/dtbs boot/extlinux
          sudo rm -f  etc/fstab
          sudo mkdir -p boot

          echo "=== 删除后 ==="; ls -la boot/

      - name: "[rootfs] Configure pacman mirrors"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work/rootfs

          sudo tee etc/pacman.d/mirrorlist > /dev/null <<'EOF'
          ## Arch Linux ARM
          Server = http://mirror.archlinuxarm.org/$arch/$repo
          Server = https://mirrors.ustc.edu.cn/archlinuxarm/$arch/$repo
          Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
          EOF

          cat etc/pacman.d/mirrorlist

      - name: "[rootfs] Cross-install base via Arch container"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work
          ROOT="$PWD/rootfs"
          PKGCACHE="$PWD/pkgcache"
          mkdir -p "$PKGCACHE"

          # 用官方 Arch 容器的 pacman 直接向 arm64 root 装包，
          # 完全绕开 qemu 模拟（快一个数量级）
          cat > pacman-cross.conf <<EOF
          [options]
          RootDir   = $ROOT
          DBPath    = $ROOT/var/lib/pacman/
          CacheDir  = $PKGCACHE/
          LogFile   = $ROOT/var/log/pacman.log
          GPGDir    = $ROOT/etc/pacman.d/gnupg/
          HookDir   = $ROOT/etc/pacman.d/hooks/
          Architecture = aarch64
          SigLevel  = Never

          [core]
          Server = http://mirror.archlinuxarm.org/\$arch/\$repo
          Server = https://mirrors.ustc.edu.cn/archlinuxarm/\$arch/\$repo

          [extra]
          Server = http://mirror.archlinuxarm.org/\$arch/\$repo
          Server = https://mirrors.ustc.edu.cn/archlinuxarm/\$arch/\$repo

          [alarm]
          Server = http://mirror.archlinuxarm.org/\$arch/\$repo
          Server = https://mirrors.ustc.edu.cn/archlinuxarm/\$arch/\$repo
          EOF
          chmod 644 pacman-cross.conf

          echo "=== 拉取 Arch 镜像 ==="
          docker pull archlinux:latest

          echo "=== 同步数据库 ==="
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Sy --config /work/pacman-cross.conf --noconfirm"

          echo "=== 安装 base + 密钥环 ==="
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -S --config /work/pacman-cross.conf --noconfirm --needed base archlinuxarm-keyring"

          echo "PACMAN_MODE=container" >> $GITHUB_ENV
          echo "✅ base 安装完成"

      - name: "[rootfs] Install packages inside chroot (fallback)"
        if: |
          steps.meta.outputs.do_rootfs == 'true' &&
          env.PACMAN_MODE == ''
        run: |
          set -e
          cd work
          ROOT="$PWD/rootfs"

          sudo cp /usr/bin/qemu-aarch64-static "$ROOT/usr/bin/" || true
          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"

          sudo mount --bind /proc "$ROOT/proc"
          sudo mount --bind /sys  "$ROOT/sys"
          sudo mount --bind /dev  "$ROOT/dev"
          sudo mount --bind /dev/pts "$ROOT/dev/pts"

          sudo chroot "$ROOT" /bin/bash -c "
            set -e
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed base archlinuxarm-keyring
          "

          sudo umount -R "$ROOT/dev" "$ROOT/sys" "$ROOT/proc" || true
          echo "PACMAN_MODE=chroot" >> $GITHUB_ENV

      - name: "[rootfs] Install target packages"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work
          ROOT="$PWD/rootfs"

          # 注意：不装 linux-aarch64（我们用自编的主线内核）
          BASE_PKGS="alsa-ucm-conf alsa-utils \
                     networkmanager openssh \
                     bluez bluez-utils haveged \
                     dosfstools e2fsprogs sudo nano vim \
                     polkit"

          # 桌面环境包组
          DESKTOP_PKGS=""
          case "${{ steps.meta.outputs.desktop }}" in
            kde)
              DESKTOP_PKGS="plasma-desktop plasma-nm plasma-pa sddm \
                            konsole dolphin kate firefox \
                            noto-fonts noto-fonts-cjk \
                            xdg-user-dirs xdg-utils"
              ;;
            phosh)
              DESKTOP_PKGS="phosh phoc squeekboard gnome-console \
                            firefox noto-fonts noto-fonts-cjk"
              ;;
            sway)
              DESKTOP_PKGS="sway swaybg foot waybar firefox \
                            noto-fonts noto-fonts-cjk"
              ;;
            none)
              DESKTOP_PKGS=""
              ;;
          esac

          EXTRA="${{ github.event.inputs.extra_packages }}"
          ALL="$BASE_PKGS $DESKTOP_PKGS $EXTRA"
          echo "将安装: $ALL"

          if [ "$PACMAN_MODE" = "container" ]; then
            docker run --rm -v "$PWD:/work" -w /work archlinux:latest \
              bash -c "pacman -S --config /work/pacman-cross.conf --noconfirm --needed $ALL"
          else
            sudo cp /usr/bin/qemu-aarch64-static "$ROOT/usr/bin/" 2>/dev/null || true
            sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf" 2>/dev/null || true
            sudo mount --bind /proc "$ROOT/proc" 2>/dev/null || true
            sudo mount --bind /sys  "$ROOT/sys"  2>/dev/null || true
            sudo mount --bind /dev  "$ROOT/dev"  2>/dev/null || true
            sudo chroot "$ROOT" /bin/bash -c "pacman -S --noconfirm --needed $ALL"
            sudo umount -R "$ROOT/dev" "$ROOT/sys" "$ROOT/proc" 2>/dev/null || true
          fi

          echo "✅ 目标包安装完成"

      - name: "[rootfs] Configure system (root only)"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work
          ROOT="$PWD/rootfs"

          sudo cp /usr/bin/qemu-aarch64-static "$ROOT/usr/bin/" 2>/dev/null || true
          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"
          sudo mount --bind /proc "$ROOT/proc" 2>/dev/null || true
          sudo mount --bind /sys  "$ROOT/sys"  2>/dev/null || true
          sudo mount --bind /dev  "$ROOT/dev"  2>/dev/null || true
          sudo mount --bind /dev/pts "$ROOT/dev/pts" 2>/dev/null || true

          sudo chroot "$ROOT" /bin/bash -c '
            set -e

            echo "=== 初始化 pacman keyring ==="
            pacman-key --init
            pacman-key --populate archlinuxarm

            echo "=== 主机名 ==="
            echo "${{ steps.meta.outputs.hostname }}" > /etc/hostname

            echo "=== 时区 ==="
            ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
            hwclock --systohc 2>/dev/null || true

            echo "=== locale ==="
            echo "en_US.UTF-8 UTF-8"  > /etc/locale.gen
            echo "zh_CN.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen
            echo "LANG=en_US.UTF-8" > /etc/locale.conf
            echo "KEYMAP=us" > /etc/vconsole.conf

            echo "=== root 密码 ==="
            echo "root:${{ steps.meta.outputs.root_pw }}" | chpasswd

            echo "=== 删除 ALARM 默认的 alarm 用户（只保留 root）==="
            if id alarm >/dev/null 2>&1; then
              pkill -u alarm 2>/dev/null || true
              userdel -r alarm 2>/dev/null || userdel alarm 2>/dev/null || true
              echo "已删除 alarm 用户"
            fi

            echo "=== 启用服务 ==="
            systemctl enable NetworkManager sshd haveged
            systemctl enable systemd-timesyncd
            systemctl disable systemd-networkd 2>/dev/null || true

            echo "=== 桌面环境服务 ==="
            case "${{ steps.meta.outputs.desktop }}" in
              kde)
                systemctl enable sddm 2>/dev/null || true
                # root 登录图形界面：sddm 默认禁止 root，这里放开
                if [ -d /etc/sddm.conf.d ]; then
                  printf "[General]\nAllowRootLogin=true\n" \
                    > /etc/sddm.conf.d/10-root-login.conf
                  echo "已允许 sddm root 登录"
                fi
                ;;
              phosh)
                systemctl enable greetd 2>/dev/null || true
                ;;
            esac

            echo "=== 清理缓存 ==="
            pacman -Scc --noconfirm || true
          '

          echo "=== 用户列表确认（应只有 root）==="
          sudo chroot "$ROOT" /bin/bash -c 'cat /etc/passwd'

          sudo umount -R "$ROOT/dev" "$ROOT/sys" "$ROOT/proc" 2>/dev/null || true
          sudo rm -f "$ROOT/usr/bin/qemu-aarch64-static"

      - name: "[rootfs] Preconfigure WiFi"
        if: |
          steps.meta.outputs.do_rootfs == 'true' &&
          github.event.inputs.wifi_ssid != ''
        run: |
          set -e
          cd work/rootfs

          SSID="${{ github.event.inputs.wifi_ssid }}"
          PSK="${{ github.event.inputs.wifi_password }}"

          sudo mkdir -p etc/NetworkManager/system-connections
          sudo tee etc/NetworkManager/system-connections/xaga-wifi.nmconnection > /dev/null <<EOF
          [connection]
          id=xaga-wifi
          type=wifi
          autoconnect=true

          [wifi]
          mode=infrastructure
          ssid=${SSID}

          [wifi-security]
          key-mgmt=wpa-psk
          psk=${PSK}

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF

          sudo chmod 600 etc/NetworkManager/system-connections/xaga-wifi.nmconnection
          echo "✅ WiFi 已预置: $SSID"

      - name: "[rootfs] Pack rootfs.img"
        if: steps.meta.outputs.do_rootfs == 'true'
        run: |
          set -e
          cd work

          SIZE_GB="${{ steps.meta.outputs.img_size }}"
          mkdir -p ../out
          IMG="$PWD/../out/rootfs.img"

          case "$SIZE_GB" in
            ''|*[!0-9]*)
              echo "::error::image_size_gb 必须是纯数字（GB），当前: '$SIZE_GB'"; exit 1
              ;;
          esac
          if [ "$SIZE_GB" -lt 2 ]; then
            echo "::error::image_size_gb 至少为 2，当前: $SIZE_GB"; exit 1
          fi

          echo "=== 创建 ${SIZE_GB}GB 镜像 ==="
          dd if=/dev/zero of="$IMG" bs=1M count=$((SIZE_GB * 1024)) status=progress

          echo "=== 格式化 ext4 ==="
          mkfs.ext4 -L rootfs -O ^metadata_csum_seed -m 1 "$IMG"

          echo "=== 写入文件系统 ==="
          mkdir -p mnt
          sudo mount -o loop "$IMG" mnt
          sudo rsync -aHAX --numeric-ids ./rootfs/ mnt/
          echo "--- 内容抽查 ---"; ls mnt/
          echo "--- 占用统计 ---"; sudo du -sh mnt/ || true
          sudo umount mnt

          echo "=== 镜像信息 ==="
          ls -lh "$IMG"; file "$IMG"
          echo "--- e2fsck ---"
          sudo e2fsck -f -n "$IMG" || echo "::warning::e2fsck 有输出，请检查"

          sha256sum "$IMG" | tee "$IMG.sha256"

      # =================================================================
      # 第 3 部分：汇总产物
      # =================================================================
      - name: "Compress artifacts (pigz)"
        if: github.event.inputs.compress_artifacts != 'false'
        run: |
          set -e
          mkdir -p out
          cd out

          echo "=== 压缩前 ==="
          ls -lh

          # 注意：GITHUB_ENV 的变量名只允许 [A-Za-z_][A-Za-z0-9_]*，
          # 不能带点号（boot.img_GZ 这种会被 GitHub 直接拒绝），
          # 所以这里用 BOOT_IMG_* / ROOTFS_IMG_* 形式。
          BOOT_IMG_GZ_HUMAN="（本次未构建）"
          ROOTFS_IMG_GZ_HUMAN="（本次未构建）"

          for f in boot.img rootfs.img; do
            [ -f "$f" ] || { echo "跳过 $f（本次未构建）"; continue; }

            # 把文件名转成合法 env 前缀: boot.img -> BOOT_IMG
            PREFIX=$(echo "${f%.img}" | tr '[:lower:].' '[:upper:]_')

            echo ""
            echo "=== 压缩 $f ==="
            ORIG_BYTES=$(stat -c%s "$f")
            echo "原始大小: $ORIG_BYTES 字节 ($(echo "scale=2; $ORIG_BYTES/1048576" | bc) MB)"

            START=$(date +%s)
            # pigz -9：多线程 gzip，产物 .gz 全平台通用
            # -k 保留原文件（稍后要核对大小，再删）
            pigz -9 -k -f "$f"
            END=$(date +%s)

            NEW_BYTES=$(stat -c%s "$f.gz")
            RATIO=$(echo "scale=2; $ORIG_BYTES/$NEW_BYTES" | bc)
            SAVED=$(echo "scale=1; 100 - ($NEW_BYTES*100/$ORIG_BYTES)" | bc)
            HUMAN=$(numfmt --to=iec "$NEW_BYTES")
            echo "压缩后  : $NEW_BYTES 字节 ($(echo "scale=2; $NEW_BYTES/1048576" | bc) MB)"
            echo "压缩比  : ${RATIO}:1   节省 ${SAVED}%   耗时 $((END-START)) 秒"

            # 校验压缩包完整性 + 生成压缩包的 sha256
            echo "--- 校验压缩包 ---"
            gzip -t "$f.gz" && echo "✅ gzip -t 通过"
            sha256sum "$f.gz" > "$f.gz.sha256"
            cat "$f.gz.sha256"

            # 记下大小，供 Release 正文引用（变量名已转为合法形式）
            {
              echo "${PREFIX}_GZ_BYTES=$NEW_BYTES"
              echo "${PREFIX}_GZ_HUMAN=$HUMAN"
            } >> $GITHUB_ENV

            if [ "$f" = "boot.img" ]; then
              BOOT_IMG_GZ_HUMAN="$HUMAN"
            else
              ROOTFS_IMG_GZ_HUMAN="$HUMAN"
            fi

            # 原始 .img 不再上传（省流量），磁盘上也删掉
            rm -f "$f" "$f.sha256"
          done

          # 供 Release 正文使用
          {
            echo "BOOT_IMG_GZ_HUMAN=$BOOT_IMG_GZ_HUMAN"
            echo "ROOTFS_IMG_GZ_HUMAN=$ROOTFS_IMG_GZ_HUMAN"
          } >> $GITHUB_ENV

          echo ""
          echo "=== 压缩后 ==="
          ls -lh

      - name: "Split large artifacts (GitHub 单文件 2GB 上限)"
        if: github.event.inputs.compress_artifacts != 'false'
        run: |
          set -e
          cd out

          # GitHub Release 单个附件硬上限 2GiB；Artifacts 单文件 10GB。
          # 为统一处理，超过 SPLIT_SIZE 就分卷，这样 Release 一定传得上去。
          shopt -s nullglob
          for f in *.gz; do
            SIZE=$(stat -c%s "$f")
            LIMIT=$(numfmt --from=iec "$SPLIT_SIZE")

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo ""
              echo "=== $f 超过 ${SPLIT_SIZE}，执行分卷 ==="
              echo "大小: $(numfmt --to=iec $SIZE)"
              rm -f "$f".part-*
              split -b "$SPLIT_SIZE" -d -a 2 "$f" "$f.part-"
              ls -lh "$f".part-*
              echo "分卷数: $(ls "$f".part-* | wc -l)"

              # 分卷后原 .gz 不再单独上传（否则等于传两遍）
              # 但要留一份整体 sha256 供用户合并后校验
              sha256sum "$f" > "$f.whole-sha256"
              rm -f "$f"
              echo "SPLIT_DONE=1" >> $GITHUB_ENV
            else
              echo "$f 大小 $(numfmt --to=iec $SIZE)，未超过 ${SPLIT_SIZE}，无需分卷"
            fi
          done
          shopt -u nullglob

          echo ""
          echo "=== 最终产物 ==="
          ls -lh

      - name: Generate README
        run: |
          set -e
          mkdir -p out
          cd out

          cat > README.txt <<EOF
          ============================================================
           xaga (Redmi Note 11T Pro) 一站式构建产物
          ============================================================
          构建时间  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Run       : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          任务选择  : ${{ steps.meta.outputs.build_target }}

          --- boot.img 来源 ---
          内核仓库   : ${{ steps.meta.outputs.kernel_repo }}
          内核分支   : ${{ steps.meta.outputs.kernel_branch }}
          内核 commit: ${KERNEL_COMMIT:-(本次未编译内核)}
          initramfs  : ${INITRAMFS_COMMIT:-(本次未编译内核)}

          --- boot.img 参数 ---
          base / kernel_offset : ${KERNEL_BASE} / ${KERNEL_OFFSET}
          pagesize             : ${PAGESIZE}
          ramdisk_offset       : ${RAMDISK_OFFSET}
          tags / dtb offset    : ${TAGS_OFFSET} / ${DTB_OFFSET}
          header_version       : ${HEADER_VERSION}

          --- 分区配置 ---
          BOOT_PARTITION   : ${{ steps.meta.outputs.boot_part }}
          NVDATA_PARTITION : ${{ steps.meta.outputs.nvdata_part }}

          --- rootfs.img 配置 ---
          来源 tarball : ${{ steps.meta.outputs.tarball }}
          主机名       : ${{ steps.meta.outputs.hostname }}
          桌面环境     : ${{ steps.meta.outputs.desktop }}
          镜像大小     : ${{ steps.meta.outputs.img_size }}GB
          用户         : 仅 root
          安装方式     : ${PACMAN_MODE:-(本次未构建 rootfs)}
          WiFi 预置    : ${{ github.event.inputs.wifi_ssid != '' && github.event.inputs.wifi_ssid || '无' }}

          --- 默认凭据（请立即修改）---
          root : ${{ steps.meta.outputs.root_pw }}

          ============================================================
           产物说明
          ============================================================
          本次是否压缩 : ${{ github.event.inputs.compress_artifacts != 'false' && '是（.gz）' || '否（原始 .img）' }}

          压缩包里装的是「原始的 .img 镜像」，解压出来即可直接 fastboot 刷入。
          压缩格式为 gzip（pigz 产出），Linux / Windows / macOS 全平台通用。

          --- 第一步：解压 ---

          Linux / macOS（系统自带 gunzip）:
            gunzip -k boot.img.gz      # -k 保留压缩包，产 boot.img
            gunzip -k rootfs.img.gz    # 产 rootfs.img（约需 6GB 空闲空间）

          也可以一步到位校验+解压:
            sha256sum -c boot.img.gz.sha256
            sha256sum -c rootfs.img.gz.sha256

          Windows:
            - 用 7-Zip / WinRAR / Bandizip 右键「解压到当前文件夹」
            - 或 PowerShell（Win10+ 自带 tar，含 gzip 支持）:
                tar -xzf boot.img.gz
                tar -xzf rootfs.img.gz
            - 注意：文件较大（解压后 6GB），确保磁盘有足够空间

          --- 如果产物是分卷的（.part-aa / .part-ab ...）---
          单个压缩包超过 ${SPLIT_SIZE} 时会被切成多卷，先合并再解压：

          Linux / macOS（也适用于 Windows 的 Git Bash / WSL）:
            cat rootfs.img.gz.part-* > rootfs.img.gz
            gunzip -k rootfs.img.gz

          Windows PowerShell:
            cmd /c copy /b rootfs.img.gz.part-aa+rootfs.img.gz.part-ab rootfs.img.gz
            然后参考上面的解压方式

          合并后用 .whole-sha256 校验（注意文件名要改回 .gz）:
            mv rootfs.img.gz.whole-sha256 rootfs.img.gz.sha256
            sha256sum -c rootfs.img.gz.sha256

          ============================================================
           刷入步骤
          ============================================================
          0. 先按上面「第一步：解压」还原出 boot.img / rootfs.img
          1. 手机进入 fastboot：关机后按住 电源 + 音量减
          2. fastboot --set-active=a
          3. fastboot flash boot boot.img
          4. fastboot flash userdata rootfs.img   （只跑 boot 时跳过此步）
          5. fastboot reboot

          --- 首次开机后扩容到全盘 ---
          ls -l /dev/disk/by-partlabel/userdata
          resize2fs /dev/disk/by-partlabel/userdata

          --- 首次开机提示（desktop=none 时）---
          没有图形界面，请用串口或 ssh 登录：
            ip a                      # 查看 IP
            ssh root@<上面的IP>       # 密码见上面「默认凭据」

          --- 校验 ---
          校验的是「下载到的压缩包」，解压前执行：
            sha256sum -c boot.img.gz.sha256    （若本次产出了 boot.img）
            sha256sum -c rootfs.img.gz.sha256  （若本次产出了 rootfs.img）
          未开启压缩时，校验文件名为 boot.img.sha256 / rootfs.img.sha256。

          --- 回滚 ---
          fastboot flash boot <备份的 stock-boot.img>
          fastboot --set-active=b
          ============================================================
          EOF

          echo "=== 产物列表 ==="
          ls -lh
          echo ""
          cat README.txt

      - name: Upload all-in-one artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xaga-${{ steps.meta.outputs.build_target }}-${{ steps.meta.outputs.desktop }}-${{ env.KERNEL_COMMIT_SHORT || 'noboot' }}
          # 产物要么是 .img（未压缩），要么是 .gz / .gz.part-*（已压缩）。
          # 用 glob 通吃两种情况，避免 if-no-files-found 误报。
          path: |
            out/*.gz
            out/*.gz.sha256
            out/*.gz.part-*
            out/*.whole-sha256
            out/*.img
            out/*.img.sha256
            out/README.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      # =================================================================
      # 第 4 部分：发布 Release
      # =================================================================
      - name: Compute release tag
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          github.event.inputs.create_release == 'true'
        id: tag
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            OUT_TAG="${{ github.ref_name }}"
          else
            OUT_TAG="xaga-${{ steps.meta.outputs.build_target }}-${{ steps.meta.outputs.desktop }}-${KERNEL_COMMIT_SHORT:-noboot}"
          fi
          echo "out_tag=$OUT_TAG" >> $GITHUB_OUTPUT
          echo "release tag = $OUT_TAG"

      - name: Create or update Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.out_tag }}
          name: ${{ steps.tag.outputs.out_tag }}
          body: |
            ## xaga (Redmi Note 11T Pro) 构建产物

            本次任务：`${{ steps.meta.outputs.build_target }}`

            ### 构建参数

            | 项目 | 值 |
            |---|---|
            | 任务选择 | `${{ steps.meta.outputs.build_target }}` |
            | 内核分支 | `${{ steps.meta.outputs.kernel_branch }}` |
            | 内核 commit | `${{ env.KERNEL_COMMIT_SHORT || '（本次未编译内核）' }}` |
            | initramfs commit | `${{ env.INITRAMFS_COMMIT_SHORT || '（本次未编译内核）' }}` |
            | 桌面环境 | `${{ steps.meta.outputs.desktop }}` |
            | 镜像大小 | `${{ steps.meta.outputs.img_size }} GB` |
            | 主机名 | `${{ steps.meta.outputs.hostname }}` |
            | 用户 | 仅 `root` |
            | boot 分区 | `${{ steps.meta.outputs.boot_part }}` |
            | nvdata 分区 | `${{ steps.meta.outputs.nvdata_part }}` |
            | 产物压缩 | ${{ github.event.inputs.compress_artifacts != 'false' && '✅ gzip 压缩' || '❌ 原始镜像' }} |
            | boot.img 压缩后 | `${{ env.BOOT_IMG_GZ_HUMAN || '（本次未构建）' }}` |
            | rootfs.img 压缩后 | `${{ env.ROOTFS_IMG_GZ_HUMAN || '（本次未构建）' }}` |

            ### 🔻 第一步：解压产物

            上传的是**压缩后**的镜像，刷机前必须先解压：

            ```bash
            # 单文件（大多数情况）
            gunzip -k boot.img.gz
            gunzip -k rootfs.img.gz

            # 如果看到 .part-aa / .part-ab 这样的分卷，先合并再解压
            cat rootfs.img.gz.part-* > rootfs.img.gz
            gunzip -k rootfs.img.gz
            ```

            Windows 用 7-Zip / WinRAR / Bandizip 直接解压即可，
            或 PowerShell：`tar -xzf rootfs.img.gz`

            ### 刷入（按顺序）

            ```bash
            # 进入 fastboot：关机后按住 电源 + 音量减
            fastboot --set-active=a
            fastboot flash boot boot.img
            fastboot flash userdata rootfs.img
            fastboot reboot
            ```

            > 若本次任务为 `boot-only`，只需要 `fastboot flash boot boot.img`；
            > 若为 `rootfs-only`，只需要 `fastboot flash userdata rootfs.img`。

            ### 首次开机后扩容到全盘

            ```bash
            ls -l /dev/disk/by-partlabel/userdata
            resize2fs /dev/disk/by-partlabel/userdata
            ```

            ### 校验（下载后、解压前执行）

            ```bash
            sha256sum -c boot.img.gz.sha256
            sha256sum -c rootfs.img.gz.sha256
            ```

            ### 回滚

            ```bash
            fastboot flash boot <stock-boot.img>
            fastboot --set-active=b
            ```

            ### ⚠️ 注意事项

            - **首次刷入前务必刷新工程版 preloader**，确保变砖后能自行救砖。
            - 本产物假定 `userdata` = `${{ steps.meta.outputs.boot_part }}`、`nvdata` = `${{ steps.meta.outputs.nvdata_part }}`。
            - 系统**只有 root 用户**，默认密码见 `README.txt`，**登录后请立即修改**。
            - 详见附件 `README.txt`。
          # 通吃压缩/未压缩两种模式，缺文件不报错（boot-only 时没 rootfs）
          files: |
            out/*.gz
            out/*.gz.sha256
            out/*.gz.part-*
            out/*.whole-sha256
            out/*.img
            out/*.img.sha256
            out/README.txt
          draft: false
          prerelease: false
          # boot-only / rootfs-only 时会缺一半文件，故不强制匹配
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## ✅ 构建成功（任务: ${{ steps.meta.outputs.build_target }}）"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            # 压缩模式下产物是 .gz，未压缩模式是 .img
            for pair in "boot.img" "rootfs.img"; do
              if [ -f "out/${pair}.gz" ]; then
                echo "| ${pair} | \`$(du -h out/${pair}.gz | cut -f1)\` (gz) |"
              elif ls out/${pair}.gz.part-* >/dev/null 2>&1; then
                TOTAL=$(cat out/${pair}.gz.part-* 2>/dev/null | wc -c)
                echo "| ${pair} | \`$(numfmt --to=iec $TOTAL)\` (gz, $(ls out/${pair}.gz.part-* | wc -l) 卷) |"
              elif [ -f "out/${pair}" ]; then
                echo "| ${pair} | \`$(du -h out/${pair} | cut -f1)\` (未压缩) |"
              else
                echo "| ${pair} | 本次未构建 |"
              fi
            done
            echo "| 内核 commit | \`${KERNEL_COMMIT_SHORT:-无}\` |"
            echo "| initramfs commit | \`${INITRAMFS_COMMIT_SHORT:-无}\` |"
            echo "| 桌面环境 | \`${{ steps.meta.outputs.desktop }}\` |"
            echo "| 镜像大小 | \`${{ steps.meta.outputs.img_size }} GB\` |"
            echo "| 用户 | 仅 \`root\` |"
            echo ""
            echo "### 🔻 刷机前先解压"
            echo '```bash'
            if [ -f out/boot.img.gz ];   then echo "gunzip -k boot.img.gz"; fi
            if [ -f out/rootfs.img.gz ]; then echo "gunzip -k rootfs.img.gz"; fi
            if ls out/rootfs.img.gz.part-* >/dev/null 2>&1; then
              echo "# rootfs 是分卷的，先合并："
              echo "cat rootfs.img.gz.part-* > rootfs.img.gz && gunzip -k rootfs.img.gz"
            fi
            echo '```'
            echo ""
            echo "### 刷入（只刷本次构建出来的部分）"
            echo '```bash'
            echo "fastboot --set-active=a"
            if ls out/boot.img* >/dev/null 2>&1;   then echo "fastboot flash boot boot.img"; fi
            if ls out/rootfs.img* >/dev/null 2>&1; then echo "fastboot flash userdata rootfs.img"; fi
            echo "fastboot reboot"
            echo '```'
            echo ""
            echo "### 产物"
            echo "- Artifacts（30 天）: \`xaga-${{ steps.meta.outputs.build_target }}-${{ steps.meta.outputs.desktop }}-${KERNEL_COMMIT_SHORT:-noboot}\`"
            if [ -n "${{ steps.tag.outputs.out_tag }}" ]; then
              echo "- Release 永久资源: \`${{ steps.tag.outputs.out_tag }}\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
